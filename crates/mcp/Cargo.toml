[package]
name = "rm-mcp"
version = "0.5.0"
edition = "2024"
license = "MIT"
authors = ["ArangoMzl"]
repository = "https://github.com/ArangoMzl/record-mind"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
rm-core = { version = "0.5.0", path = "../core" }
rmcp = { version = "3.10.0", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
