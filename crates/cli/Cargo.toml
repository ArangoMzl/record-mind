[package]
name = "record-mind"
version = "0.5.1"
edition = "2024"
license = "MIT"
authors = ["ArangoMzl"]
repository = "https://github.com/ArangoMzl/record-mind"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
rm-core = { version = "0.5.1", path = "../core" }
rm-mcp = { version = "0.5.1", path = "../mcp" }
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
