[package]
name = "record-mind-app"
version = "0.4.0"
edition = "2024"
license = "MIT"
authors = ["ArangoMzl"]
repository = "https://github.com/ArangoMzl/record-mind"
description = "record-mind: tablero de micro-pendientes para Claude Code"

[lib]
name = "record_mind_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
rm-core = { version = "0.4.0", path = "../../crates/core" }
rm-mcp = { version = "0.4.0", path = "../../crates/mcp" }
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
png = "0.18.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse"] }
